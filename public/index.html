<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Signal</title><style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#737373;--line:#e8e8e3;--good:#176b4d;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:34px 18px 70px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted)}h1{font-size:30px;margin:7px 0 0}.search{display:flex;gap:8px;margin:28px 0 18px}input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none}button{border:0;border-radius:12px;background:#191919;color:#fff;padding:0 20px;font-weight:700}.watch{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px}.chip{background:#eaeae5;color:#333;padding:7px 10px;border-radius:999px;font-size:13px;cursor:pointer}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:22px;margin-bottom:14px}.symbol{font-size:13px;color:var(--muted)}.price{font-size:36px;font-weight:760;margin:7px 0}.change{font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:18px;min-height:128px}.label{font-size:13px;color:var(--muted)}.value{font-size:26px;font-weight:730;margin:12px 0 7px}.rule{font-size:12px;color:var(--muted)}.met{color:var(--good);font-weight:700}.market{margin-top:28px}.market h2{font-size:17px}.status{margin-top:14px;padding:16px;border-radius:14px;background:#ecece7;font-weight:700}.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:20px}.error{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px} @media(max-width:600px){.top{display:block}.grid{grid-template-columns:1fr 1fr}.price{font-size:32px}.card{min-height:118px;padding:15px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">MARKET CHECK</div><h1>Stock Signal</h1></div><div class="eyebrow">무료 개인용 대시보드</div></div><form class="search" id="form"><input id="q" value="SOXL" placeholder="SOXL, NVDA, AAPL, QQQ"><button>검색</button></form><div class="watch" id="watch"></div><div id="app">불러오는 중…</div><div class="foot">※ 이 화면은 매수·매도 추천이 아니라 사용자가 정한 조건을 확인하기 위한 도구입니다. 무료 데이터 소스 특성상 가격이 지연되거나 일시적으로 제공되지 않을 수 있습니다.</div></main><script>
const $=s=>document.querySelector(s), fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d}):'—';
let watch=JSON.parse(localStorage.getItem('watch')||'["SOXL","QQQ","NVDA"]'); function chips(){ $('#watch').innerHTML=watch.map(x=>`<span class="chip" data-s="${x}">★ ${x}</span>`).join('')+`<span class="chip" id="add">＋ 현재 종목 저장</span>`; document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>load(e.dataset.s)); $('#add').onclick=()=>{let s=$('#q').value.trim().toUpperCase(); if(s&&!watch.includes(s)){watch.push(s);localStorage.setItem('watch',JSON.stringify(watch));chips()}}} chips();
function card(label,value,rule,met){return `<div class="card"><div class="label">${label}</div><div class="value ${met?'met':''}">${value}</div><div class="rule">${rule}</div></div>`}
async function load(s){s=s.toUpperCase(); $('#q').value=s; $('#app').innerHTML='불러오는 중…'; try{let r=await fetch('/api/dashboard/'+encodeURIComponent(s)),d=await r.json(); if(!r.ok)throw Error(d.detail||d.error); let x=d.stock,m=d.market; let checks=[x.rsi<=30,x.drawdown<=-14,m.vix>=30,m.sp500Drawdown<=-14,m.sp500Above200===false], n=checks.filter(Boolean).length; $('#app').innerHTML=`<section class="hero"><div class="symbol">${x.symbol} · ${x.name||''}</div><div class="price">${fmt(x.price)} ${x.currency||''}</div><div class="change ${x.changePct>=0?'met':''}">${x.changePct>=0?'+':''}${fmt(x.changePct)}%</div></section><div class="grid">${card('RSI (14)',fmt(x.rsi,1),'기준: 30 이하 과매도',checks[0])}${card('종목 고점 대비 낙폭',fmt(x.drawdown,1)+'%','참고 기준: -14% 이하',checks[1])}${card('종목 200일선',x.above200?'위':'아래',`200DMA ${fmt(x.sma200)}`,x.above200===false)}${card('VIX',fmt(m.vix,1),'기준: 30 이상',checks[2])}</div><section class="market"><h2>미국 시장</h2><div class="grid">${card('S&P 500 MDD',fmt(m.sp500Drawdown,1)+'%','기준: -14% 이하',checks[3])}${card('S&P 500 200일선',m.sp500Above200?'위':'아래',`200DMA ${fmt(m.sp500Sma200)}`,checks[4])}${card('Fear & Greed','준비 중','무료·안정적 데이터 소스 확보 후 추가',false)}</div><div class="status">현재 설정 조건 ${n} / 5 충족</div></section>`;}catch(e){$('#app').innerHTML=`<div class="error">데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>`}}
$('#form').onsubmit=e=>{e.preventDefault();load($('#q').value.trim())}; load('SOXL');
</script></body></html>
