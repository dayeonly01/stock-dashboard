<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Check</title><style>
:root{--paper:#f2f1ec;--ink:#111;--muted:#6e6c65;--line:#171717;--soft:#d8d6ce;--accent:#d9f25f;--white:#fbfbf8;--good:#17684b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 30px 90px}.mast{display:flex;justify-content:space-between;align-items:flex-start;border-top:2px solid var(--line);padding-top:13px}.kicker{font-size:12px;letter-spacing:.2em}.brand{font-size:54px;line-height:.94;letter-spacing:-.055em;margin:16px 0 0;font-weight:800}.aside{font-size:12px;color:var(--muted);text-align:right}.search{display:grid;grid-template-columns:1fr 100px;margin:56px 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}input{font:inherit;font-size:24px;background:transparent;border:0;padding:20px 2px;outline:none}button{border:0;background:var(--ink);color:white;font-weight:700;font-size:14px;cursor:pointer}.watch{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 55px}.chip{font-size:12px;border:1px solid #bcbab2;border-radius:999px;padding:8px 12px;cursor:pointer;background:transparent}.hero{display:grid;grid-template-columns:1.4fr .6fr;border-top:2px solid var(--line);padding:18px 0 45px}.symbol{font-size:14px;color:var(--muted)}.ticker{font-size:86px;font-weight:800;letter-spacing:-.06em;line-height:.9;margin-top:16px}.pricebox{text-align:right;align-self:end}.price{font-size:38px;font-weight:700}.change{font-size:15px;margin-top:8px}.met{color:var(--good)}.section{border-top:2px solid var(--line);padding-top:14px;margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}.sectionhead h2{font-size:28px;letter-spacing:-.04em;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--soft)}.metric{display:grid;grid-template-columns:180px 130px 1fr;gap:18px;align-items:center;min-height:108px;border-bottom:1px solid var(--soft);padding:15px 4px}.metric:nth-child(odd){border-right:1px solid var(--soft);padding-right:24px}.metric:nth-child(even){padding-left:24px}.mlabel{font-size:13px;font-weight:700}.mvalue{font-size:28px;font-weight:800;letter-spacing:-.03em}.explain{font-size:13px;line-height:1.55;color:var(--muted)}.rule{display:block;color:#333;margin-top:4px;font-size:11px}.chartbox{border-top:1px solid var(--soft);padding-top:18px}.charttools{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.periods{display:flex;gap:4px}.period{background:transparent;color:var(--ink);border:1px solid var(--soft);padding:7px 10px;font-size:11px}.period.on{background:var(--ink);color:white}.canvaswrap{height:320px;position:relative;background:rgba(255,255,255,.22)}canvas{width:100%;height:100%;display:block}.status{display:flex;justify-content:space-between;gap:20px;background:var(--accent);padding:18px 20px;margin-top:30px;font-size:14px}.status strong{font-size:22px}.foot{border-top:1px solid var(--line);margin-top:60px;padding-top:14px;font-size:11px;color:var(--muted);line-height:1.7}.error{padding:25px 0;border-top:2px solid var(--line)}@media(max-width:800px){.wrap{padding:24px 18px 60px}.brand{font-size:42px}.hero{grid-template-columns:1fr}.pricebox{text-align:left;margin-top:30px}.ticker{font-size:64px}.metrics{grid-template-columns:1fr}.metric,.metric:nth-child(odd),.metric:nth-child(even){border-right:0;padding:14px 0;grid-template-columns:120px 100px 1fr}.watch{margin-bottom:38px}}@media(max-width:520px){.mast .aside{display:none}.search{grid-template-columns:1fr 72px;margin-top:40px}input{font-size:19px}.metric,.metric:nth-child(odd),.metric:nth-child(even){grid-template-columns:1fr 1fr;gap:6px}.explain{grid-column:1/-1}.sectionhead h2{font-size:24px}.ticker{font-size:54px}.price{font-size:31px}.canvaswrap{height:250px}}
</style></head><body><main class="wrap"><header class="mast"><div><div class="kicker">MARKET CHECK / PERSONAL DASHBOARD</div><div class="brand">STOCK<br>SIGNAL</div></div><div class="aside">FREE DATA · NO API KEY<br>시장과 종목을 한 화면에서 확인합니다.</div></header><form class="search" id="form"><input id="q" value="SOXL" placeholder="Ticker — SOXL, NVDA, AAPL"><button>SEARCH</button></form><div class="watch" id="watch"></div><div id="app">불러오는 중…</div><div class="foot">이 화면은 투자 판단을 대신하지 않습니다. 무료 데이터 소스 특성상 가격과 지표가 지연되거나 일시적으로 제공되지 않을 수 있습니다. RSI·이동평균·낙폭은 제공된 가격 데이터를 바탕으로 계산합니다.</div></main><script>
const $=s=>document.querySelector(s), fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d}):'—';
let current='SOXL', period='6m'; let watch=JSON.parse(localStorage.getItem('watch')||'["SOXL","QQQ","NVDA"]');
function chips(){ $('#watch').innerHTML=watch.map(x=>`<span class="chip" data-s="${x}">★ ${x}</span>`).join('')+`<span class="chip" id="add">＋ 현재 종목 저장</span>`; document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>load(e.dataset.s)); $('#add').onclick=()=>{let s=$('#q').value.trim().toUpperCase();if(s&&!watch.includes(s)){watch.push(s);localStorage.setItem('watch',JSON.stringify(watch));chips()}}} chips();
function metric(label,value,desc,rule,met=false){return `<div class="metric"><div class="mlabel">${label}</div><div class="mvalue ${met?'met':''}">${value}</div><div class="explain">${desc}<span class="rule">${rule}</span></div></div>`}
async function drawChart(sym,p='6m'){period=p; document.querySelectorAll('.period').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); const c=$('#priceChart'); if(!c)return; const r=await fetch(`/api/history/${encodeURIComponent(sym)}?period=${p}`),d=await r.json(); if(!r.ok||!d.series?.length)return; const ctx=c.getContext('2d'), box=c.parentElement.getBoundingClientRect(), ratio=devicePixelRatio||1;c.width=box.width*ratio;c.height=box.height*ratio;ctx.scale(ratio,ratio);const W=box.width,H=box.height,pad={l:10,r:58,t:16,b:28},a=d.series,ys=a.map(x=>x.p),min=Math.min(...ys),max=Math.max(...ys),range=max-min||1;ctx.clearRect(0,0,W,H);ctx.font='11px Arial';ctx.fillStyle='#777';ctx.strokeStyle='#d3d1c9';ctx.lineWidth=1;for(let i=0;i<4;i++){let y=pad.t+(H-pad.t-pad.b)*i/3, val=max-range*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText(fmt(val,2),W-pad.r+8,y+4)}ctx.strokeStyle='#111';ctx.lineWidth=1.8;ctx.beginPath();a.forEach((v,i)=>{let x=pad.l+(W-pad.l-pad.r)*i/(a.length-1),y=pad.t+(max-v.p)/range*(H-pad.t-pad.b);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const first=new Date(a[0].t),last=new Date(a.at(-1).t);ctx.fillStyle='#777';ctx.fillText(first.toLocaleDateString('ko-KR',{month:'short',day:'numeric',year:p==='5y'?'numeric':undefined}),pad.l,H-7);let txt=last.toLocaleDateString('ko-KR',{month:'short',day:'numeric',year:p==='5y'?'numeric':undefined});ctx.fillText(txt,W-pad.r-ctx.measureText(txt).width,H-7)}
async function load(s){current=s.toUpperCase();$('#q').value=current;$('#app').innerHTML='불러오는 중…';try{let r=await fetch('/api/dashboard/'+encodeURIComponent(current)),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);let x=d.stock,m=d.market;let checks=[x.rsi<=30,m.vix>=30,m.sp500Drawdown<=-14,m.sp500Above200===false],n=checks.filter(Boolean).length;$('#app').innerHTML=`<section class="hero"><div><div class="symbol">${x.name||x.symbol}</div><div class="ticker">${x.symbol}</div></div><div class="pricebox"><div class="price">${fmt(x.price)} ${x.currency||''}</div><div class="change ${x.changePct>=0?'met':''}">${x.changePct>=0?'+':''}${fmt(x.changePct)}%</div></div></section><section class="section"><div class="sectionhead"><h2>MARKET</h2><span>미국 시장 전체의 위험·추세 상태</span></div><div class="metrics">${metric('VIX',fmt(m.vix,1),'시장이 예상하는 단기 변동성입니다. 높을수록 불안이 큰 편입니다.','내 기준 · 30 이상',checks[1])}${metric('S&P 500 MDD',fmt(m.sp500Drawdown,1)+'%','최근 2년 고점에서 S&P 500이 얼마나 내려왔는지 보여줍니다.','내 기준 · -14% 이하',checks[2])}${metric('S&P 500 · 200D',m.sp500Above200?'ABOVE':'BELOW','현재 지수가 200일 평균보다 위인지 아래인지 봅니다. 장기 추세 확인용입니다.',`200DMA ${fmt(m.sp500Sma200)} · ${fmt(m.sp500Distance200,1)}%`,checks[3])}${metric('Fear & Greed','—','공포와 탐욕 심리를 0~100으로 나타내는 시장 심리 지표입니다.','추후 추가 · 내 기준 20 미만')}</div></section><section class="section"><div class="sectionhead"><h2>${x.symbol}</h2><span>검색한 종목의 가격·기술 지표</span></div><div class="metrics">${metric('RSI · 14',fmt(x.rsi,1),'최근 상승·하락 힘을 0~100으로 표시합니다. 낮을수록 과매도 구간에 가깝습니다.','내 기준 · 30 이하',checks[0])}${metric('2Y HIGH ↓',fmt(x.drawdown,1)+'%','최근 2년 최고가에서 현재 가격이 얼마나 내려왔는지 보여줍니다.','참고용 · 시장 MDD와 별도')}${metric('200 DAY',fmt(x.sma200),'최근 200거래일 평균 가격입니다. 장기 가격 흐름을 볼 때 사용합니다.',`현재가가 200일선보다 ${x.above200?'위':'아래'} · ${fmt(x.distance200,1)}%`)}</div></section><section class="section"><div class="sectionhead"><h2>PRICE HISTORY</h2><span>${x.symbol} 가격 흐름</span></div><div class="chartbox"><div class="charttools"><span class="symbol">기간을 선택하세요</span><div class="periods"><button class="period" data-p="1m" type="button">1M</button><button class="period on" data-p="6m" type="button">6M</button><button class="period" data-p="1y" type="button">1Y</button><button class="period" data-p="5y" type="button">5Y</button></div></div><div class="canvaswrap"><canvas id="priceChart"></canvas></div></div></section><div class="status"><span>현재 설정한 핵심 조건</span><strong>${n} / 4 충족</strong></div>`;document.querySelectorAll('.period').forEach(b=>b.onclick=()=>drawChart(current,b.dataset.p));await drawChart(current,'6m');}catch(e){$('#app').innerHTML=`<div class="error">데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>`}}
$('#form').onsubmit=e=>{e.preventDefault();load($('#q').value.trim())};window.addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(()=>drawChart(current,period),150)});load('SOXL');
</script></body></html>
