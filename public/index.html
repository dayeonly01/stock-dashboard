<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Check</title><style>
:root{--paper:#f3f2ed;--ink:#111;--muted:#6d6a62;--line:#171717;--soft:#d6d3ca;--pink:#f4dfe6;--green:#e6efd2;--yellow:#f3e9bf;--blue:#dfeaf0;--lav:#e8e0ef;--peach:#f2dfcf;--good:#17684b;--hotpink:#d94f7d;--navy:#253858}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px 28px 70px}.mast{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--line);padding:6px 0 5px}.kicker{font-size:9px;letter-spacing:.14em;color:var(--muted)}.brand{display:none}.aside{font-size:9px;color:var(--muted);text-align:right}.topbar{display:grid;grid-template-columns:1fr 104px;margin:10px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}input{font:inherit;font-size:18px;background:#fff;border:1px solid #c9c6bd;padding:12px 14px;outline:none}input:focus{border-color:#111;box-shadow:inset 0 0 0 1px #111}button{border:0;background:var(--ink);color:white;font-weight:700;font-size:12px;cursor:pointer}.watch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.chip{font-size:11px;border:1px solid #bcb8ae;border-radius:999px;padding:6px 10px;cursor:pointer;background:transparent}.summary{display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--line);padding:12px 0}.identity{display:flex;gap:12px;align-items:baseline}.ticker{font-size:34px;font-weight:800;letter-spacing:-.05em}.company{font-size:11px;color:var(--muted)}.pricebox{text-align:right}.price{font-size:25px;font-weight:800}.change{font-size:13px;margin-top:3px}.met{color:var(--hotpink)}.negative{color:var(--navy)}.metric-met{color:var(--hotpink)}.metric-unmet{color:var(--navy)}.conditionbar{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:12px}.conditionbar .label{font-size:10px;letter-spacing:.12em;font-weight:700}.conditionbar strong{font-size:17px}.conditionbar .mini{font-size:10px;color:var(--muted)}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.sectionhead h2{font-size:15px;letter-spacing:.08em;margin:0}.sectionhead span{font-size:10px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:stretch}.cards>.card{height:100%}.fg-card{grid-column:span 1;min-height:152px}.fg-layout{display:grid;grid-template-columns:minmax(135px,.9fr) minmax(105px,1.1fr);gap:10px;align-items:center}.fg-gauge{width:92%;max-width:205px;margin:auto;display:block;overflow:visible}.fg-side .cvalue{font-size:17px;margin:3px 0;color:var(--muted);letter-spacing:0}.fg-rating{font-size:29px;line-height:1;font-weight:900;letter-spacing:-.035em;text-transform:uppercase}.gauge-text{font:700 6.3px Arial;fill:#5f5d58;letter-spacing:0}.gauge-num{font:800 17px Arial;fill:#111}.gauge-tick{font:7px Arial;fill:#777}.card{min-height:152px;padding:15px 16px 13px;border:1px solid rgba(17,17,17,.12);display:flex;flex-direction:column;justify-content:space-between}.pink{background:var(--pink)}.green{background:var(--green)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.lav{background:var(--lav)}.peach{background:var(--peach)}.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.clabel{font-size:11px;font-weight:800;letter-spacing:.04em}.badge{font-size:9px;border:1px solid rgba(17,17,17,.3);border-radius:999px;padding:3px 6px;white-space:nowrap}.cvalue{font-size:36px;line-height:1;font-weight:850;letter-spacing:-.05em;margin:7px 0 4px}.crule{font-size:10px;font-weight:700}.cdesc{font-size:10px;line-height:1.35;color:#5d5a54;margin-top:7px}.ctime{font-size:9px;line-height:1.35;color:#706d66;margin-top:8px;padding-top:7px;border-top:1px solid rgba(17,17,17,.12)}.dataupdate{font-size:10px;color:var(--muted);padding:7px 0 2px}.priceactions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:5px}.refreshbtn{background:transparent;color:var(--ink);border:1px solid #bcb8ae;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:700}.refreshbtn:hover{background:#fff}.refreshbtn:disabled{opacity:.55;cursor:wait}.insight{font-size:14px;font-weight:800;margin-top:8px}.distance{font-size:22px;font-weight:900;letter-spacing:-.03em;margin-top:6px}.session{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;border:1px solid #aaa;border-radius:999px;padding:3px 6px;margin-right:5px}.foot{border-top:1px solid var(--line);margin-top:35px;padding-top:10px;font-size:10px;color:var(--muted);line-height:1.6}.error{padding:25px 0;border-top:2px solid var(--line)}@media(max-width:820px){.fg-card{grid-column:span 1}.fg-layout{grid-template-columns:minmax(120px,.9fr) minmax(95px,1.1fr)}.fg-gauge{max-width:190px}.wrap{padding:18px 16px 55px}.cards{grid-template-columns:repeat(2,1fr)}.company{display:none}.card{min-height:145px}.cvalue{font-size:32px}}@media(max-width:520px){.fg-card{grid-column:span 1}.fg-layout{display:block}.fg-gauge{max-width:155px}.fg-side{display:block}.fg-rating{font-size:21px}.fg-side .cvalue{font-size:14px}.aside{display:none}.topbar{grid-template-columns:1fr 76px}.summary{align-items:center}.ticker{font-size:28px}.price{font-size:21px}.conditionbar{gap:8px;flex-wrap:wrap}.cards{grid-template-columns:1fr 1fr;gap:7px}.card{min-height:150px;padding:12px}.cvalue{font-size:30px}.cdesc{font-size:9px}.sectionhead span{display:none}}
</style></head><body><main class="wrap"><header class="mast"><div><div class="kicker">MARKET CHECK</div></div><div class="aside">FREE DATA · NO API KEY<br>핵심 지표를 먼저 확인합니다.</div></header><form class="topbar" id="form"><input id="q" value="SOXL" placeholder="Ticker — SOXL, NVDA, AAPL"><button>SEARCH</button></form><div class="watch" id="watch"></div><div id="app">불러오는 중…</div><div class="foot">이 화면은 투자 판단을 대신하지 않습니다. 무료 데이터 소스 특성상 가격과 지표가 지연되거나 일시적으로 제공되지 않을 수 있습니다. RSI·이동평균·낙폭은 제공된 가격 데이터를 바탕으로 계산합니다.</div></main><script>
const $=s=>document.querySelector(s),fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d}):'—';let current='SOXL';let watch=JSON.parse(localStorage.getItem('watch')||'["SOXL","QQQ","NVDA"]');
function chips(){$('#watch').innerHTML=watch.map(x=>`<span class="chip" data-s="${x}">★ ${x}</span>`).join('')+`<span class="chip" id="add">＋ 현재 종목 저장</span>`;document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>load(e.dataset.s));$('#add').onclick=()=>{let s=$('#q').value.trim().toUpperCase();if(s&&!watch.includes(s)){watch.push(s);localStorage.setItem('watch',JSON.stringify(watch));chips()}}}chips();
function when(iso,kind='price'){if(!iso)return'기준 시각 확인 불가';let d=new Date(iso),opt={month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false},et=new Intl.DateTimeFormat('ko-KR',{...opt,timeZone:'America/New_York'}).format(d),kst=new Intl.DateTimeFormat('ko-KR',{...opt,timeZone:'Asia/Seoul'}).format(d);return kind==='daily'?`최근 완료 일봉 · ${et} ET / ${kst} KST`:`${et} ET / ${kst} KST`}
const fgKo=r=>({'Extreme Fear':'극도의 공포','Fear':'공포','Neutral':'눈치 보는 중','Greed':'낙관적','Extreme Greed':'매우 낙관적'})[r]||r||'—';
function fgGauge(value,rating,met,time){let v=Math.max(0,Math.min(100,Number(value)||0)),ang=Math.PI-(v/100)*Math.PI,cx=180,cy=142,len=72,x=cx+Math.cos(ang)*len,y=cy-Math.sin(ang)*len;function pt(n,r=100){let a=Math.PI-(n/100)*Math.PI;return[cx+Math.cos(a)*r,cy-Math.sin(a)*r]}let labels=[['EXTREME',10],['FEAR',32],['NEUTRAL',50],['GREED',68],['EXTREME',90]];return`<div class="card pink fg-card"><div class="ctop"><div class="clabel">FEAR & GREED</div><span class="badge">${met?'● 기준 충족':'○ 기준 미충족'}</span></div><div class="fg-layout"><svg class="fg-gauge" viewBox="0 0 360 180"><path d="M60 142 A120 120 0 0 1 300 142" fill="none" stroke="rgba(255,255,255,.58)" stroke-width="38"/>${labels.map(([t,n])=>{let q=pt(n,108);return`<text class="gauge-text" x="${q[0]}" y="${q[1]}" text-anchor="middle">${t}</text>`}).join('')}<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#222" stroke-width="6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="20" fill="#fff"/><text class="gauge-num" x="${cx}" y="${cy+6}" text-anchor="middle">${fmt(v,0)}</text></svg><div class="fg-side"><div class="fg-rating ${met?'metric-met':'metric-unmet'}">${fgKo(rating)}</div><div class="cvalue">${fmt(v,0)}</div><div class="crule">사용자 기준 &lt; 20</div></div></div><div class="ctime">${time}</div></div>`}
function fgWhen(v){if(!v)return'기준 날짜 확인 불가';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return`데이터 기준 · ${v.replaceAll('-','.')} · 시간 단위 갱신`;return`데이터 기준 · ${when(v)}`}
function card(label,value,rule,insight,color,met=null,time='',extra=''){let badge=met===true?'● 기준 충족':met===false?'○ 기준 미충족':'참고';return`<div class="card ${color}"><div><div class="ctop"><div class="clabel">${label}</div><span class="badge">${badge}</span></div><div class="cvalue ${met===true?'metric-met':met===false?'metric-unmet':''}">${value}</div>${extra}<div class="crule">${rule}</div><div class="insight">${insight}</div></div>${time?`<div class="ctime">${time}</div>`:''}</div>`}
function vixText(v){return v>=30?'시장이 크게 흔들리고 있어요':v>=20?'불안감이 커지고 있어요':'시장이 비교적 차분해요'}function rsiText(v){return v<=30?'많이 눌려 있어요':v>=70?'단기 과열 구간이에요':'과열도 과매도도 아니에요'}function mddText(v){return v<=-20?'큰 하락 구간이에요':v<=-14?'고점에서 많이 내려왔어요':v<=-10?'조정이 깊어지고 있어요':'고점에서 멀지 않아요'}
async function load(s){current=s.toUpperCase();$('#q').value=current;$('#app').innerHTML='불러오는 중…';try{let r=await fetch('/api/dashboard/'+encodeURIComponent(current)+'?t='+Date.now()),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);let x=d.stock,m=d.market,fg=d.fearGreed||{};let checks=[fg.available?fg.value<20:false,m.vix>=30,x.rsi<=30,x.above200===false,m.sp500Drawdown<=-14,m.sp500Above200===false],n=checks.filter(Boolean).length;let session=x.session||'CLOSED';$('#app').innerHTML=`<section class="summary"><div class="identity"><div class="ticker">${x.symbol}</div><div class="company">${x.name||''}</div></div><div class="pricebox"><div><span class="session">${session}</span><span class="price">${fmt(x.price)} ${x.currency||''}</span></div><div class="change ${x.changePct>=0?'met':'negative'}">${x.changePct>=0?'+':''}${fmt(x.changePct)}% · 직전 정규장 종가 대비</div><div class="priceactions"><span class="dataupdate">현재 가격 · ${when(x.priceAsOf)}</span><button class="refreshbtn" id="refresh" type="button">↻ 현재 데이터 새로고침</button></div></div></section><div class="conditionbar"><span class="label">핵심 조건</span><strong>${n} / 6 충족</strong><span class="mini">시장 하락·공포 조건이 많이 충족될수록 관심 구간에 가까워집니다.</span></div><section class="section"><div class="sectionhead"><h2>MARKET</h2><span>현재 시장 상태를 한눈에 확인</span></div><div class="cards">${fg.available?fgGauge(fg.value,fg.rating,checks[0],fgWhen(fg.asOf)):card('FEAR & GREED','—','사용자 기준 < 20','현재 데이터 확인 불가','pink',null,'일시 미연결')}${card('VIX',fmt(m.vix,1),'사용자 기준 ≥ 30',vixText(m.vix),'green',checks[1],when(m.vixAsOf))}${card('RSI · 14',fmt(x.rsi,1),'사용자 기준 ≤ 30',rsiText(x.rsi),'lav',checks[2],when(x.dailyAsOf,'daily')+' · 14개 일봉 기반')}${card(`${x.symbol} · 200일 이동평균`,fmt(x.sma200),'현재 가격과 200일선 비교',x.above200?'장기 추세보다 강해요':'장기 추세보다 약해요','peach',checks[3],when(x.dailyAsOf,'daily')+' · 평균선은 완료 일봉 기준',`<div class="distance ${checks[3]?'metric-met':'metric-unmet'}">이격도 ${x.distance200>=0?'+':''}${fmt(x.distance200,1)}% · ${x.above200?'위':'아래'}</div><div class="cdesc">현재 ${session} 가격 ${fmt(x.price)}</div>`) }${card('S&P 500 MDD',fmt(m.sp500Drawdown,1)+'%','사용자 기준 ≤ -14%',mddText(m.sp500Drawdown),'yellow',checks[4],when(m.sp500DailyAsOf,'daily')+' · 최근 2년 고점 대비')}${card('S&P 500 · 200일 이동평균',fmt(m.sp500Sma200),'최근 완료 일봉과 200일선 비교',m.sp500Above200?'시장 장기 추세가 강해요':'시장 장기 추세가 약해요','blue',checks[5],when(m.sp500DailyAsOf,'daily'),`<div class="distance ${checks[5]?'metric-met':'metric-unmet'}">이격도 ${m.sp500Distance200>=0?'+':''}${fmt(m.sp500Distance200,1)}% · ${m.sp500Above200?'위':'아래'}</div><div class="cdesc">최근 완료 일봉 ${fmt(m.sp500DailyClose)}</div>`)}</div></section>`;$('#refresh').onclick=()=>load(current)}catch(e){$('#app').innerHTML=`<div class="error">데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>`}}
$('#form').onsubmit=e=>{e.preventDefault();load($('#q').value.trim())};load('SOXL');
</script></body></html>
