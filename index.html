<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Check</title><style>
:root{--paper:#f3f2ed;--ink:#111;--muted:#6d6a62;--line:#171717;--soft:#d6d3ca;--pink:#f4dfe6;--green:#e6efd2;--yellow:#f3e9bf;--blue:#dfeaf0;--lav:#e8e0ef;--peach:#f2dfcf;--good:#17684b;--hotpink:#d94f7d;--navy:#253858}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px 28px 70px}.mast{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--line);padding:6px 0 5px}.kicker{font-size:9px;letter-spacing:.14em;color:var(--muted)}.brand{display:none}.aside{font-size:9px;color:var(--muted);text-align:right}.topbar{display:grid;grid-template-columns:1fr 104px;margin:10px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}input{font:inherit;font-size:18px;background:#fff;border:1px solid #c9c6bd;padding:12px 14px;outline:none}input:focus{border-color:#111;box-shadow:inset 0 0 0 1px #111}button{border:0;background:var(--ink);color:white;font-weight:700;font-size:12px;cursor:pointer}.watch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.chip{font-size:11px;border:1px solid #bcb8ae;border-radius:999px;padding:6px 10px;cursor:pointer;background:transparent}.summary{display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--line);padding:12px 0}.identity{display:flex;gap:12px;align-items:baseline}.ticker{font-size:34px;font-weight:800;letter-spacing:-.05em}.company{font-size:11px;color:var(--muted)}.pricebox{text-align:right}.price{font-size:25px;font-weight:800}.change{font-size:13px;margin-top:3px}.met{color:var(--hotpink)}.negative{color:var(--navy)}.metric-met{color:var(--hotpink)}.metric-unmet{color:var(--navy)}.conditionbar{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:12px}.conditionbar .label{font-size:10px;letter-spacing:.12em;font-weight:700}.conditionbar strong{font-size:17px}.conditionbar .mini{font-size:10px;color:var(--muted)}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.sectionhead h2{font-size:15px;letter-spacing:.08em;margin:0}.sectionhead span{font-size:10px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{min-height:152px;padding:15px 16px 13px;border:1px solid rgba(17,17,17,.12);display:flex;flex-direction:column;justify-content:space-between}.pink{background:var(--pink)}.green{background:var(--green)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.lav{background:var(--lav)}.peach{background:var(--peach)}.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.clabel{font-size:11px;font-weight:800;letter-spacing:.04em}.badge{font-size:9px;border:1px solid rgba(17,17,17,.3);border-radius:999px;padding:3px 6px;white-space:nowrap}.cvalue{font-size:36px;line-height:1;font-weight:850;letter-spacing:-.05em;margin:7px 0 4px}.crule{font-size:10px;font-weight:700}.cdesc{font-size:10px;line-height:1.35;color:#5d5a54;margin-top:7px}.ctime{font-size:9px;line-height:1.35;color:#706d66;margin-top:8px;padding-top:7px;border-top:1px solid rgba(17,17,17,.12)}.dataupdate{font-size:10px;color:var(--muted);padding:7px 0 2px}.chartSection{border-top:2px solid var(--line);padding-top:10px;margin-top:20px}.chartbox{border-top:1px solid var(--soft);padding-top:10px}.charttools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.periods{display:flex;gap:4px}.period{background:transparent;color:var(--ink);border:1px solid var(--soft);padding:6px 9px;font-size:10px}.period.on{background:var(--ink);color:white}.canvaswrap{height:280px;position:relative;background:rgba(255,255,255,.2)}canvas{width:100%;height:100%;display:block}.foot{border-top:1px solid var(--line);margin-top:35px;padding-top:10px;font-size:10px;color:var(--muted);line-height:1.6}.error{padding:25px 0;border-top:2px solid var(--line)}@media(max-width:820px){.wrap{padding:18px 16px 55px}.cards{grid-template-columns:repeat(2,1fr)}.company{display:none}.card{min-height:145px}.cvalue{font-size:32px}}@media(max-width:520px){.aside{display:none}.topbar{grid-template-columns:1fr 76px}.summary{align-items:center}.ticker{font-size:28px}.price{font-size:21px}.conditionbar{gap:8px;flex-wrap:wrap}.cards{grid-template-columns:1fr 1fr;gap:7px}.card{min-height:150px;padding:12px}.cvalue{font-size:30px}.cdesc{font-size:9px}.sectionhead span{display:none}.canvaswrap{height:230px}}
</style></head><body><main class="wrap"><header class="mast"><div><div class="kicker">MARKET CHECK</div></div><div class="aside">FREE DATA · NO API KEY<br>핵심 지표를 먼저 확인합니다.</div></header><form class="topbar" id="form"><input id="q" value="SOXL" placeholder="Ticker — SOXL, NVDA, AAPL"><button>SEARCH</button></form><div class="watch" id="watch"></div><div id="app">불러오는 중…</div><div class="foot">이 화면은 투자 판단을 대신하지 않습니다. 무료 데이터 소스 특성상 가격과 지표가 지연되거나 일시적으로 제공되지 않을 수 있습니다. RSI·이동평균·낙폭은 제공된 가격 데이터를 바탕으로 계산합니다.</div></main><script>
const $=s=>document.querySelector(s), fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d}):'—';
let current='SOXL', period='6m'; let watch=JSON.parse(localStorage.getItem('watch')||'["SOXL","QQQ","NVDA"]');
function chips(){ $('#watch').innerHTML=watch.map(x=>`<span class="chip" data-s="${x}">★ ${x}</span>`).join('')+`<span class="chip" id="add">＋ 현재 종목 저장</span>`; document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>load(e.dataset.s)); $('#add').onclick=()=>{let s=$('#q').value.trim().toUpperCase();if(s&&!watch.includes(s)){watch.push(s);localStorage.setItem('watch',JSON.stringify(watch));chips()}}} chips();
function when(iso,kind='price'){if(!iso)return '기준 시각 확인 불가';let d=new Date(iso),et=new Intl.DateTimeFormat('ko-KR',{timeZone:'America/New_York',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d),kst=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);return kind==='daily'?`최근 완료 일봉 · ${et} ET / ${kst} KST`:`최근 수집 시각 · ${et} ET / ${kst} KST`} function card(label,value,rule,desc,color,met=null,time=''){let badge=met===true?'● 기준 충족':met===false?'○ 기준 미충족':'참고';return `<div class="card ${color}"><div><div class="ctop"><div class="clabel">${label}</div><span class="badge">${badge}</span></div><div class="cvalue ${met===true?'metric-met':met===false?'metric-unmet':''}">${value}</div><div class="crule">${rule}</div></div><div><div class="cdesc">${desc}</div>${time?`<div class="ctime">${time}</div>`:''}</div></div>`}
async function drawChart(sym,p='6m'){period=p; document.querySelectorAll('.period').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); const c=$('#priceChart'); if(!c)return; const r=await fetch(`/api/history/${encodeURIComponent(sym)}?period=${p}`),d=await r.json(); if(!r.ok||!d.series?.length)return; const ctx=c.getContext('2d'), box=c.parentElement.getBoundingClientRect(), ratio=devicePixelRatio||1;c.width=box.width*ratio;c.height=box.height*ratio;ctx.scale(ratio,ratio);const W=box.width,H=box.height,pad={l:10,r:58,t:16,b:28},a=d.series,ys=a.map(x=>x.p),min=Math.min(...ys),max=Math.max(...ys),range=max-min||1;ctx.clearRect(0,0,W,H);ctx.font='11px Arial';ctx.fillStyle='#777';ctx.strokeStyle='#d3d1c9';ctx.lineWidth=1;for(let i=0;i<4;i++){let y=pad.t+(H-pad.t-pad.b)*i/3, val=max-range*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText(fmt(val,2),W-pad.r+8,y+4)}ctx.strokeStyle='#111';ctx.lineWidth=1.8;ctx.beginPath();a.forEach((v,i)=>{let x=pad.l+(W-pad.l-pad.r)*i/(a.length-1),y=pad.t+(max-v.p)/range*(H-pad.t-pad.b);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const first=new Date(a[0].t),last=new Date(a.at(-1).t);ctx.fillStyle='#777';ctx.fillText(first.toLocaleDateString('ko-KR',{month:'short',day:'numeric',year:p==='5y'?'numeric':undefined}),pad.l,H-7);let txt=last.toLocaleDateString('ko-KR',{month:'short',day:'numeric',year:p==='5y'?'numeric':undefined});ctx.fillText(txt,W-pad.r-ctx.measureText(txt).width,H-7)}
async function load(s){current=s.toUpperCase();$('#q').value=current;$('#app').innerHTML='불러오는 중…';try{let r=await fetch('/api/dashboard/'+encodeURIComponent(current)),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);let x=d.stock,m=d.market;let checks=[m.vix>=30,m.sp500Drawdown<=-14,m.sp500Above200===false,x.rsi<=30,x.above200===false],n=checks.filter(Boolean).length;$('#app').innerHTML=`
<section class="summary"><div class="identity"><div class="ticker">${x.symbol}</div><div class="company">${x.name||''}</div></div><div class="pricebox"><div class="price">${fmt(x.price)} ${x.currency||''}</div><div class="change ${x.changePct>=0?'met':'negative'}">${x.changePct>=0?'+':''}${fmt(x.changePct)}%</div><div class="dataupdate">${when(x.priceAsOf)} · 직전 정규장 종가 대비</div></div></section>
<div class="conditionbar"><span class="label">핵심 조건</span><strong>${n} / 5 충족</strong><span class="mini">Fear & Greed는 무료 안정 데이터 확보 전까지 집계 제외</span></div>
<section class="section"><div class="sectionhead"><h2>MARKET</h2><span>시장 전체 상태</span></div><div class="cards">
${card('FEAR & GREED','—','사용자 기준 < 20','시장 심리를 0~100으로 나타냅니다. 낮을수록 공포가 큰 구간입니다.','pink',null,'현재 무료 안정 데이터 미연결')}
${card('VIX',fmt(m.vix,1),'사용자 기준 ≥ 30','예상 변동성입니다. 높을수록 시장 불안이 큰 편입니다.','green',checks[0],when(m.vixAsOf))}
${card('S&P 500 MDD',fmt(m.sp500Drawdown,1)+'%','사용자 기준 ≤ -14%','최근 2년 고점에서 S&P 500이 얼마나 내려왔는지 봅니다.','yellow',checks[1],when(m.sp500DailyAsOf,'daily')+' · 최근 2년 고점 대비')}
${card('S&P 500 · 200D',m.sp500Above200?'ABOVE':'BELOW',`200DMA ${fmt(m.sp500Sma200)}`,'200일 평균선 위·아래로 장기 추세를 확인합니다.','blue',checks[2],when(m.sp500DailyAsOf,'daily')+' · 최근 200거래일 종가 평균')}
${card('RSI · 14',fmt(x.rsi,1),'사용자 기준 ≤ 30','검색 종목의 최근 상승·하락 힘입니다. 낮을수록 과매도에 가깝습니다.','lav',checks[3],when(x.dailyAsOf,'daily')+' · 최근 14개 일봉 기반')}
${card(`${x.symbol} · 200D`,fmt(x.sma200),`${x.above200?'ABOVE':'BELOW'} · ${fmt(x.distance200,1)}%`,'검색 종목의 200일 평균 가격과 최근 종가 위치입니다.','peach',checks[4],when(x.dailyAsOf,'daily')+' · 최근 200거래일 종가 평균')}
</div></section>
<section class="chartSection"><div class="sectionhead"><h2>PRICE HISTORY</h2><span>${x.symbol} 가격 흐름 · 2Y 고점 대비 ${fmt(x.drawdown,1)}%</span></div><div class="chartbox"><div class="charttools"><span class="company">기간 선택</span><div class="periods"><button class="period" data-p="1m" type="button">1M</button><button class="period on" data-p="6m" type="button">6M</button><button class="period" data-p="1y" type="button">1Y</button><button class="period" data-p="5y" type="button">5Y</button></div></div><div class="canvaswrap"><canvas id="priceChart"></canvas></div></div></section>`;document.querySelectorAll('.period').forEach(b=>b.onclick=()=>drawChart(current,b.dataset.p));await drawChart(current,'6m');}catch(e){$('#app').innerHTML=`<div class="error">데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>`}}
$('#form').onsubmit=e=>{e.preventDefault();load($('#q').value.trim())};window.addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(()=>drawChart(current,period),150)});load('SOXL');
</script></body></html>
